<form [formGroup]="form" (ngSubmit)="onClickSubmit()">
  <div class="form-row">
    <app-generic-input
      label="Appointment Date"
      controlName="appointmentDate"
      type="date"
      placeholder="Select appointment date"
    />
    <app-generic-select
      label="Appointment Type"
      controlName="appointmentType"
      placeholder="Select appointment type"
      [options]="appointmentTypeOptions"
    />
  </div>

  <div class="form-row">
    <app-generic-select
      controlName="recurringItemId"
      label="Recurring Item"
      [options]="recurringItemOptions"
    />

    <app-generic-select
      controlName="vendorId"
      label="Vendor"
      [options]="vendorOptionsFromRecurringItem"
    />

    <app-generic-input
      label="Check Points"
      controlName="checkPoints"
      placeholder="Enter check points"
    />
  </div>

  <app-generic-button [handler]="onClickSubmit" btnClass="submit-button"> Save </app-generic-button>
</form>
