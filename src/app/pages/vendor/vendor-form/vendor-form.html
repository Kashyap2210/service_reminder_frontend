<form [formGroup]="form" (ngSubmit)="onClickSubmit()">
  <div class="form-row">
    <app-generic-input label="Name" controlName="name" placeholder="Enter name" />
    <app-generic-input label="Address" controlName="address" placeholder="Enter address" />
  </div>
  <div class="form-row">
    <app-generic-input
      label="Contact No"
      controlName="contactNo"
      placeholder="Enter contact number"
    />
    <app-generic-input label="Email" controlName="email" type="email" placeholder="Enter email" />
    <div class="form-row">
      <app-generic-multi-select
        label="Recurring Items"
        controlName="recurringItemIds"
        placeholder="Select recurring items"
        [options]="recurringItemOptions"
      />
    </div>
  </div>
  <app-generic-button [handler]="onClickSubmit" btnClass="submit-button"> Save </app-generic-button>
</form>
