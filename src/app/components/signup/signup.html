  <div class="page-shell">
    <div class="card">
      <h1>Create Account</h1>

      @if (success()) {
        <div class="success-message">
          Account created! Please
          <a [routerLink]="['/login']" (click)="navigateToLogin()">login</a>.
        </div>
      }

      @if (!success()) {
        <div class="field">
          <label for="name">Name</label>
          <input
            id="name"
            type="text"
            [value]="name()"
            (input)="name.set($any($event.target).value)"
            placeholder="Enter your name"
          />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            placeholder="Enter your email"
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="Enter your password"
          />
        </div>

        <div class="field">
          <label for="contactNo">Contact No</label>
          <input
            id="contactNo"
            type="text"
            [value]="contactNo()"
            (input)="contactNo.set($any($event.target).value)"
            placeholder="Enter your contact number"
          />
        </div>

        <!-- <div class="field">
          <label for="role">Role</label>
          <select id="role" [value]="role()" (change)="role.set($any($event.target).value)">
            <option value="USER">USER</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div> -->

        <app-generic-button [handler]="onSubmit" btnClass="submit-button">
          Sign Up
        </app-generic-button>

        @if (error()) {
          <p class="error-message">{{ error() }}</p>
        }
      }

      <p class="footer-text">
        Already have an account?
        <a [routerLink]="['/login']">Login</a>
      </p>
    </div>
  </div>
