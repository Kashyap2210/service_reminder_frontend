<div class="page-shell">
  <div class="card">
    <h1>User Profile</h1>

    <div class="field">
      <label>Name</label>
      <div class="value">{{ user()?.name }}</div>
    </div>

    <div class="field">
      <label>Email</label>
      <div class="value">{{ user()?.email }}</div>
    </div>

    <div class="field">
      <label>Contact No</label>
      <div class="value">{{ user()?.contactNo }}</div>
    </div>

    <div class="field">
      <label>Role</label>
      <div class="value">{{ user()?.role }}</div>
    </div>

    <div class="profile-actions">
      <app-generic-button [handler]="logout" btnClass="button-logout">Logout</app-generic-button>
      <app-delete-button [handler]="deleteAccount" />
    </div>

    <app-generic-modal
      message="Are you sure you want to delete your account? This action cannot be undone."
      [confirmHandler]="handleConfirmDelete"
    />
  </div>
</div>
