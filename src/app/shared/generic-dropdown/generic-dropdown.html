<div class="field" [class.has-error]="!!errorMessage">
  <label>{{ label() }}</label>

  <div class="select-wrapper" [class.open]="isOpen()">
    <button type="button" class="select-trigger" (click)="toggleDropdown()">
      <span [class.placeholder]="!selectedLabel">
        {{ selectedLabel || placeholder() }}
      </span>
      <span class="chevron">&#8964;</span>
    </button>

    @if (isOpen()) {
      <div class="dropdown-panel">
        <div class="search-wrapper">
          <input
            class="search-input"
            type="text"
            placeholder="Search..."
            [value]="searchQuery()"
            (input)="onSearch($event)"
            (click)="$event.stopPropagation()"
          />
        </div>

        <ul class="options-list">
          @for (option of filteredOptions(); track option.value) {
            <li
              class="option"
              [class.selected]="control.value === option.value"
              (click)="selectOption(option)"
            >
              {{ option.label }}
            </li>
          } @empty {
            <li class="option no-results">No results found</li>
          }
        </ul>
      </div>
    }
  </div>

  @if (errorMessage) {
    <span class="error-hint">{{ errorMessage }}</span>
  }
</div>
