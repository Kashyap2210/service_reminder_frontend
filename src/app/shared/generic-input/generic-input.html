<div class="field" [class.has-error]="!!errorMessage">
  <label [for]="controlName()">{{ label() }}</label>
  <input
    [id]="controlName()"
    [type]="type()"
    [placeholder]="placeholder()"
    [formControlName]="controlName()"
  />
  @if (errorMessage) {
    <span class="error-hint">{{ errorMessage }}</span>
  }
</div>
